<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARE Fluides</title>
<style>
  :root{--ink:#14201A;--muted:#4A5A51;--green:#1F6B45;--green-dark:#174F34;--mint:#E2F0E7;--bg:#F3F5F2;--line:#E6EAE6;--field:#C9D2CC;--warn:#8A3B08;--warn-bg:#FBE9DD;--white:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px}
  header .t{flex:1;min-width:0}
  header .k{font-size:12px;color:#A9C9B6;letter-spacing:.04em}
  header .h{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{width:44px;height:44px;border:0;border-radius:12px;background:#24332B;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--white);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .rows{background:var(--white);border-radius:16px;padding:4px 16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;text-align:right}
  .sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .note{font-size:13px;color:var(--muted);line-height:1.45}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
  input,select,textarea{height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 12px;background:#fff;width:100%}
  textarea{height:auto;padding:10px 12px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .btn{min-height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;width:100%}
  .btn.out{background:#fff;color:var(--ink);border:1.5px solid var(--ink);font-weight:600}
  .btn.dark{background:var(--ink)}
  .btn.danger{background:var(--warn-bg);color:var(--warn)}
  .btn.ghost{background:transparent;color:var(--green);font-weight:600}
  .btn[disabled]{background:#D5DCD7;color:var(--muted);cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .pw{position:relative;display:block}
  .pw input{padding-right:52px;width:100%}
  .pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sharebox{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--mint);border-radius:12px;padding:12px;user-select:all;-webkit-user-select:all}
  .chip{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--field);background:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--green);color:#fff}
  .item{text-align:left;border:0;border-radius:16px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(20,32,26,.08);width:100%}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--mint);color:var(--green-dark);white-space:nowrap}
  .badge.grey{background:var(--line);color:var(--ink)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .msg{padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.4}
  .msg.err{background:var(--warn-bg);color:var(--warn)}
  .msg.ok{background:var(--mint);color:var(--green-dark)}
  .admincard{text-align:left;border:0;border-radius:16px;background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%}
  .admincard small{display:block;font-size:13px;color:#A9C9B6;margin-top:2px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid #E0E5E1;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  nav .in{max-width:528px;margin:0 auto;display:flex;gap:10px;align-items:center}
  nav .tab{flex:1;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
  nav .tab.on{background:var(--mint);color:var(--green)}
  .avatar{width:50px;height:50px;border-radius:99px;border:2px solid #A9C9B6;background:var(--mint);color:var(--green);font-weight:700;cursor:pointer;flex:0 0 auto}
  .avatar.on{background:var(--green);color:#fff;border-color:var(--green)}
  .search{position:relative}
  .search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
  .search input{padding-left:44px}
  .center{align-items:center;text-align:center}
  .logo{width:84px;height:84px;border-radius:24px;background:var(--ink);color:#A9C9B6;display:flex;align-items:center;justify-content:center}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<div id="app"><div class="spin" aria-label="Chargement"></div></div>
<script>
/* ============================== État ============================== */
var S = {
  token: null, user: null, screen: 'loading', stack: [], status: null, msg: null, loaded: false,
  chantiers: [], search: '', page: 0, cur: null, form: null, fluides: [], machines: [],
  ops: [], opForm: null, pwd: { oldPassword: '', newPassword: '', confirm: '' }, busy: false, showPw: {}, share: null, mine: load('are_mine') === '1'
};
var TYPES = ['PAC AE', 'PAC AA Monosplit', 'PAC AA Gainable', 'PAC AA Multisplit', 'PAC AA Multisplit gainable', 'Ballon thermodynamique'];
var MAIN_FLUIDS = ['R32', 'R410A', 'R454C'];
var PAGE = 10; // chantiers par page sur l'accueil

function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ============================== Serveur ============================== */
function rawCall(action, data) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        var e = new Error((r && r.error) || 'Erreur inconnue'); e.code = r && r.error; reject(e);
      })
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : 'Connexion impossible')); })
      .api({ action: action, token: S.token, data: data || {} });
  });
}
/** Reconnexion silencieuse avec le jeton « rester connecté » (prolonge les 30 jours). */
function resume() {
  var r = load('are_remember');
  if (!r) return Promise.reject(new Error('SESSION'));
  return rawCall('resume', { remember: r }).then(function (s) { S.token = s.token; S.user = s.user; store('are_token', s.token); return s; })
    .catch(function (e) { if (e.code === 'SESSION') store('are_remember', null); throw e; });
}
function call(action, data) {
  return rawCall(action, data).catch(function (e) {
    if (e.code !== 'SESSION') throw e;
    // session de 6 h expirée : on tente la reconnexion automatique puis on rejoue l'action
    return resume().then(function () { return rawCall(action, data); }).catch(function (e2) {
      if (e2.code === 'SESSION' || e2.message === 'SESSION') { sessionLost(); throw new Error('Session expirée, reconnecte-toi.'); }
      throw e2;
    });
  });
}
function sessionLost() {
  S.token = null; S.user = null; store('are_token', null);
  S.stack = []; S.form = { email: '', password: '', remember: true }; S.screen = 'login'; S.msg = { err: true, text: 'Session expirée, reconnecte-toi.' }; render();
}
function run(promise, okText) {
  S.busy = true; render();
  return promise.then(function (x) { S.busy = false; if (okText) S.msg = { text: okText }; render(); return x; })
    .catch(function (e) { S.busy = false; S.msg = { err: true, text: e.message }; render(); throw e; });
}

/* ============================== Outils ============================== */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(u) { return ((u.prenom || '?').charAt(0) + (u.nom || '').charAt(0)).toUpperCase(); }
function isAdmin() { return S.user && S.user.role === 'admin'; }
function go(screen, keepStack) { if (!keepStack) S.stack.push(S.screen); S.screen = screen; S.msg = null; render(); window.scrollTo(0, 0); }
function home() { S.stack = []; S.screen = 'home'; S.msg = null; loadChantiers(); }
function back() { S.screen = S.stack.pop() || 'home'; S.msg = null; render(); window.scrollTo(0, 0); }
function fluidInfo(code) { for (var i = 0; i < S.fluides.length; i++) if (S.fluides[i].code === code) return S.fluides[i]; return null; }
function genPassword() { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', s = ''; for (var i = 0; i < 10; i++) s += c.charAt(Math.floor(Math.random() * c.length)); return s; }
var ICON = {
  eye: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0112 5c6.5 0 10 7 10 7a17.6 17.6 0 01-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 005.4-1.6"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  home: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  users: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>',
  camera: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  drop: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 5 6.5 5 9.5a5 5 0 01-10 0C7 9.5 9 7 12 3z"/><path d="M10 14.5a2 2 0 002 2"/></svg>'
};

/* ============================== Données ============================== */
function loadChantiers() {
  render();
  Promise.all([call('listChantiers'), S.fluides.length ? Promise.resolve(S.fluides) : call('listFluides'),
    S.machines.length ? Promise.resolve(S.machines) : call('listMachines').catch(function () { return []; })])
    .then(function (r) { S.chantiers = r[0]; S.fluides = r[1]; S.machines = r[2] || []; S.loaded = true; render(); })
    .catch(function (e) { S.msg = { err: true, text: e.message }; render(); });
}
function emptyForm() {
  return { id: '', projet: '', prenom: '', nom: '', adresse: '', cp: '', ville: '', marque: '', modele: '', chargeUsine: '',
    longueur: '', precharge: '', gpm: '', type: '', fluideChoix: '', fluideAutre: '', inflam: '', gwpManuel: '', commentaires: '' };
}
function formFromChantier(c) {
  var f = emptyForm();
  Object.keys(f).forEach(function (k) { if (c[k] !== undefined) f[k] = c[k]; });
  f.fluideChoix = !c.fluide ? '' : (MAIN_FLUIDS.indexOf(c.fluide) >= 0 ? c.fluide : 'Autre');
  f.fluideAutre = f.fluideChoix === 'Autre' ? c.fluide : '';
  var auto = fluidInfo(c.fluide);
  f.gwpManuel = (c.gwp && (!auto || String(auto.gwp) !== String(c.gwp).replace(',', '.'))) ? c.gwp : '';
  return f;
}
function normModele(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function findMachine(modele) {
  var k = normModele(modele);
  if (k.length < 4) return null;
  return S.machines.filter(function (m) { return normModele(m.modele) === k; })[0] || null;
}
/** Modèle reconnu dans la base : remplit marque, fluide, précharge, g/m et type. */
function applyMachine(f, m, seulementVides) {
  var put = function (k, v) { if (v && (!seulementVides || !f[k])) f[k] = v; };
  f.modele = m.modele; f._modeleAutre = false; f._marqueAutre = false;
  if (m.marque) f.marque = m.marque;
  put('precharge', m.precharge); put('gpm', m.gpm); put('type', m.type); put('chargeUsine', m.charge);
  // Machine sans liaisons frigorifiques (monobloc hydraulique ou RAC Solo) : longueur, précharge et charge à 0
  if (m.liaison && !/frigo/i.test(m.liaison)) { f.longueur = '0'; f.precharge = '0'; f.gpm = '0'; }
  if (m.fluide && (!seulementVides || !formFluid(f))) {
    if (MAIN_FLUIDS.indexOf(m.fluide) >= 0) { f.fluideChoix = m.fluide; f.fluideAutre = ''; }
    else { f.fluideChoix = 'Autre'; f.fluideAutre = m.fluide; }
    f.gwpManuel = '';
  }
}
function brands() {
  var out = [];
  S.machines.forEach(function (m) { if (m.marque && out.indexOf(m.marque) < 0) out.push(m.marque); });
  return out.sort();
}
/** Modèle retiré : on efface aussi la précharge et le g/m qu'il avait remplis. */
function dropMachine(f) {
  var m = findMachine(f.modele);
  if (m) {
    var hy = m.liaison && !/frigo/i.test(m.liaison);
    if (f.precharge === (hy ? '0' : m.precharge)) f.precharge = '';
    if (f.gpm === (hy ? '0' : m.gpm)) f.gpm = '';
    if (hy && f.longueur === '0') f.longueur = '';
    if (f.chargeUsine === m.charge) f.chargeUsine = '';
  }
  f.modele = ''; f._modeleAutre = false;
}
function brandsFor(type) {
  var out = [];
  S.machines.forEach(function (m) { if (m.marque && (!type || m.type === type) && out.indexOf(m.marque) < 0) out.push(m.marque); });
  return out.sort();
}
function typeSelect(f) {
  return '<label>Type d’installation<select data-bind="form.type">' + '<option value=""' + (!f.type ? ' selected' : '') + '>Non renseigné</option>' +
    TYPES.map(function (v) { return '<option' + (f.type === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select></label>';
}
function brandMatch(b) { b = String(b || '').trim().toLowerCase(); return b ? brands().filter(function (x) { return x.toLowerCase() === b; })[0] || '' : ''; }
/** Unité extérieure : type d'installation, puis marque, puis modèle (listes filtrées) ; le choix du modèle remplit le reste. */
function suggBox(f) {
  if (!f._sugg || !f._sugg.length) return '';
  return '<div class="msg" style="margin:0;display:flex;flex-direction:column;gap:8px"><b>Modèles proposés d’après la feuille de relevé</b>' +
    (f._modeleLu && !findMachine(f._modeleLu) ? '<span style="font-size:13px">Lu sur la feuille : « ' + esc(f._modeleLu) + ' ». Vérifie sur la plaque de l’unité extérieure.</span>' : '') +
    f._sugg.map(function (x, i) {
      var on = x.modele === f.modele;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="pickSugg" data-arg="' + esc(x.modele) + '" style="text-align:left;height:auto;padding:8px 14px;border-radius:12px">' +
        esc(x.marque + ' ' + x.modele) + (i === 0 ? ' · le plus probable' : '') + (x.raison ? '<br><span style="font-weight:400;font-size:13px">' + esc(x.raison) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
}
function ueFields(f) {
  if (!S.machines.length) return typeSelect(f) + field('Marque', 'form.marque', { ph: 'Ex. DAIKIN' }) + field('Modèle', 'form.modele', { ph: 'Ex. ERGA04EV' });
  var top = suggBox(f);
  var bm = f._marqueAutre ? '' : brandMatch(f.marque);
  var bSel = f._marqueAutre || (f.marque && !bm) ? 'Autre' : bm;
  var bl = brandsFor(f.type); if (bm && bl.indexOf(bm) < 0) bl.push(bm);
  var html = top + typeSelect(f) + '<label>Marque<select data-bind="form._marqueSel">' +
    ['<option value="">Choisir la marque…</option>'].concat(bl.map(function (b) { return '<option' + (b === bSel ? ' selected' : '') + '>' + esc(b) + '</option>'; }))
      .concat('<option value="Autre"' + (bSel === 'Autre' ? ' selected' : '') + '>Autre marque…</option>').join('') + '</select></label>';
  if (bSel === 'Autre') return html + field('Nom de la marque', 'form.marque', { ph: 'Ex. Atlantic' }) + field('Modèle', 'form.modele', { ph: 'Référence de l’unité extérieure' });
  if (!bm) return html;
  var mm = findMachine(f.modele), mSel = f._modeleAutre || (f.modele && !(mm && mm.marque === bm)) ? 'Autre' : (mm ? mm.modele : '');
  var groups = {}, order = [];
  var pourType = S.machines.filter(function (m) { return m.marque === bm && (!f.type || m.type === f.type); });
  if (!pourType.length) pourType = S.machines.filter(function (m) { return m.marque === bm; });
  pourType.forEach(function (m) { var g = m.gamme || 'Autres'; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(m); });
  html += '<label>Modèle<select data-bind="form._modeleSel"><option value="">Choisir le modèle…</option>' +
    order.map(function (g) {
      return '<optgroup label="' + esc(g) + '">' + groups[g].map(function (m) { return '<option value="' + esc(m.modele) + '"' + (m.modele === mSel ? ' selected' : '') + '>' + esc(m.modele + (m.gamme ? ' – ' + m.gamme : '')) + '</option>'; }).join('') + '</optgroup>';
    }).join('') + '<option value="Autre"' + (mSel === 'Autre' ? ' selected' : '') + '>Autre modèle…</option></select></label>';
  if (mSel === 'Autre') html += field('Référence du modèle', 'form.modele', { ph: 'Référence de l’unité extérieure' });
  return html + machineHint(f);
}
function num(v) { var n = Number(String(v || '').replace(',', '.')); return isFinite(n) ? n : 0; }
/** Alerte si la longueur saisie dépasse la longueur maximale du constructeur. */
function longueurAlerte(f, m) {
  if (!m || !m.lmax || !num(f.longueur) || num(f.longueur) <= num(m.lmax)) return '';
  return '<div class="msg err" style="margin:0">Longueur de ' + esc(f.longueur) + ' m supérieure au maximum constructeur (' + esc(m.lmax) + ' m) pour ' + esc(m.modele) + '. Vérifie la longueur ou le modèle.</div>';
}
function machineHint(f) {
  var m = findMachine(f.modele);
  if (!m) return f.modele && S.machines.length ? '<div class="note">Modèle absent de la base machines : remplis la précharge et la charge à la main.</div>' : '';
  var bits = [m.fluide, m.charge ? 'charge usine ' + m.charge + ' kg' : '', m.precharge ? 'préchargé ' + m.precharge + ' m' : '', m.gpm ? m.gpm + ' g/m' : ''].filter(Boolean);
  var manque = [!m.precharge && /frigo/i.test(m.liaison) ? 'précharge' : '', !m.gpm && /frigo/i.test(m.liaison) ? 'g/m' : ''].filter(Boolean);

      '<div class="note">' + (isAdmin() ? 'Ton nom et ton attestation seront repris sur tes propres CERFA.' : 'Ton profil est tenu à jour par l’administrateur. Ton nom et ton numéro d’attestation sont repris sur tes CERFA.') + '</div>';
    return h;
  },

  admin: function () {
    return msgBox() + shareBox() + '<button class="btn" data-act="newOp">' + ICON.plus + 'Créer un compte</button><div class="sec">Comptes (' + S.ops.length + ')</div>' +
      S.ops.map(function (o) {
        return '<button class="item" data-act="editOp" data-arg="' + esc(o.id) + '"' + (o.actif ? '' : ' style="opacity:.6"') + '><span style="font-size:16px;font-weight:700">' + esc((o.prenom + ' ' + o.nom).trim() || 'Sans nom') + '</span>' +
          '<span class="note">' + esc(o.email || 'e-mail à renseigner') + (o.email2 ? ' · ' + esc(o.email2) : '') + '</span><span class="chips" style="gap:6px">' + (o.actif ? '' : '<span class="badge warn">Désactivé</span>') + '<span class="badge ' + (o.role === 'admin' ? '' : 'grey') + '">' + (o.role === 'admin' ? 'Admin' : 'Opérateur') + '</span>' +
          '<span class="badge ' + (o.hasPassword ? '' : 'warn') + '">' + (o.hasPassword ? 'Peut se connecter' : 'Mot de passe à définir') + '</span>' +
          '<span class="badge ' + (o.attestation ? '' : 'warn') + '">' + (o.attestation ? 'Attestation ' + esc(o.attestation) : 'Attestation à renseigner') + '</span></span></button>';
      }).join('') + '<div class="note">Les opérateurs ne peuvent pas créer de compte. Tu crées chaque compte avec son e-mail et son mot de passe, puis tu le lui transmets.</div>';
  },

  opForm: function () {
    var f = S.opForm;
    return msgBox() + '<div class="sec">Connexion</div><div class="card">' + field('Adresse e-mail (identifiant)', 'opForm.email', { type: 'email' }) +
      field('E-mail secondaire (facultatif)', 'opForm.email2', { type: 'email', ph: 'Pour se connecter aussi avec une autre adresse' }) +
      '<label for="pw">' + (f.id ? 'Nouveau mot de passe (laisser vide pour ne pas changer)' : 'Mot de passe') + '</label>' +
      '<div style="display:flex;gap:8px"><input id="pw" type="text" data-bind="opForm.password" value="' + esc(f.password) + '"><button type="button" class="chip" data-act="genPwd">Générer</button></div>' +
      '<div class="note">Rôle</div>' + chips([['operateur', 'Opérateur'], ['admin', 'Admin']], f.role, 'setRole') + '</div>' +
      '<div class="sec">Profil</div><div class="card"><div class="g2">' + field('Prénom', 'opForm.prenom') + field('Nom', 'opForm.nom') + '</div>' +
      field('N° d’attestation d’aptitude', 'opForm.attestation') +
      '<div class="note">Le dépôt du fichier de l’attestation arrive avec la livraison 3. En attendant, garde-le dans le dossier Drive « Opérateurs ».</div></div>' +
      '<button class="btn" data-act="saveOp"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Enregistrement…' : 'Enregistrer le compte') + '</button>' +
      (f.id && f.id !== S.user.id ?
        '<div class="sec" style="margin-top:12px">Gérer ce compte</div>' +
        '<div class="rows"><div class="row"><span>Appareils « rester connecté »</span><span>' + (f.appareils || 0) + '</span></div>' +
        '<div class="row"><span>Dernière utilisation</span><span>' + esc(f.derniereUtilisation || '—') + '</span></div></div>' +
        '<button class="btn out" data-act="disconnectOp">Déconnecter tous ses appareils</button><div class="note">Coupe tout de suite sa session sur tous ses téléphones et ordinateurs : il devra se reconnecter avec son mot de passe (téléphone perdu ou volé, par exemple).</div>' +
        (f.actif ?
          '<button class="btn out" data-act="toggleActif">Désactiver le compte</button><div class="note">L’opérateur ne peut plus se connecter, mais son nom reste sur les CERFA déjà signés. À utiliser quand quelqu’un quitte l’entreprise.</div>' :
          '<button class="btn out" data-act="toggleActif">Réactiver le compte</button>') +
        (S.confirmDelete ?
          '<div class="msg err">Supprimer définitivement ce compte ? Cette action ne peut pas être annulée.</div><div class="g2"><button class="btn out" data-act="cancelDelete">Annuler</button><button class="btn danger" data-act="deleteOp">Oui, supprimer</button></div>' :
          '<button class="btn danger" data-act="askDelete">Supprimer le compte</button><div class="note">Possible seulement pour un compte qui n’a jamais servi (erreur de saisie, ligne d’exemple).</div>') : '');
  }
};

/** Droits : l'administrateur agit sur tous les chantiers, un opérateur seulement sur ceux qu'il a créés. */
function ownsChantier(c) { return !!(c && S.user && (S.user.role === 'admin' || c.creePar === S.user.id)); }
var APP_ADDRESS = 'https://fluides.toumany.com';
function shareText(x) {
  return 'Bonjour' + (x.prenom ? ' ' + x.prenom : '') + ',\n' + (x.nouveau ? 'Ton compte ARE Fluides est créé.' : 'Ton mot de passe ARE Fluides a été changé.') + '\n\n' +
    'Adresse : ' + APP_ADDRESS + '\nIdentifiant : ' + x.email + '\nMot de passe : ' + x.password + '\n\nTu pourras le changer dans ton profil (avatar en bas à droite).';
}
function shareBox() {
  var x = S.share; if (!x) return '';
  var t = shareText(x), u = encodeURIComponent(t);
  return '<div class="card" style="gap:10px;border:2px solid var(--green)"><b>Identifiants à transmettre à ' + esc(x.prenom || x.email) + '</b>' +
    '<div class="sharebox">' + esc(t) + '</div>' +
    '<button class="btn" data-act="copyShare">Copier les identifiants</button>' +
    '<div class="g3"><a class="btn out" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + u + '">WhatsApp</a>' +
    '<a class="btn out" style="text-decoration:none" target="_blank" href="sms:?&body=' + u + '">SMS</a>' +
    '<a class="btn out" style="text-decoration:none" target="_blank" href="mailto:' + encodeURIComponent(x.email) + '?subject=' + encodeURIComponent('Ton accès ARE Fluides') + '&body=' + u + '">E-mail</a></div>' +
    '<div class="note">Le mot de passe n’est plus visible une fois cet encadré fermé : il est enregistré sous forme chiffrée.</div>' +
    '<button class="btn ghost" data-act="closeShare">C’est transmis, fermer</button></div>';
}
function canDeleteChantier(c) { return ownsChantier(c) && !c.misEnService; }
function deleteBlock(c) {
  if (!ownsChantier(c)) return '<div class="note" style="text-align:center">Seul l’opérateur qui a créé ce chantier ou un administrateur peut le supprimer.</div>';
  if (c.misEnService) return '<div class="note" style="text-align:center">Ce chantier ne peut pas être supprimé car une mise en service a déjà été réalisée. Pour le supprimer, il faut d’abord supprimer la mise en service.</div>';
  return S.confirmDelete
    ? '<div class="msg err">Supprimer la fiche chantier de ' + esc(c.client) + ' ? Elle disparaît de la liste (une copie est gardée dans le tableur).</div><div class="g2"><button class="btn out" data-act="cancelDelete">Annuler</button><button class="btn danger" data-act="deleteChantier">Oui, supprimer</button></div>'
    : '<button class="btn danger" data-act="askDelete">Supprimer ce chantier</button>';
}
var TITLES = { setup: 'Première connexion', login: 'Connexion', home: 'Accueil', chantier: 'Fiche chantier', profile: 'Mon profil', admin: 'Gestion des comptes', opForm: 'Compte opérateur', loading: 'Chargement' };

function render() {
  var scr = S.screen, logged = !!S.user;
  var showHeader = scr !== 'login' && scr !== 'setup';
  var title = scr === 'chantierForm' ? (S.form && S.form.id ? 'Modifier le chantier' : 'Nouveau chantier') : (scr === 'opForm' && S.opForm && !S.opForm.id ? 'Nouveau compte' : TITLES[scr]);
  var html = '';
  if (showHeader) {
    html += '<header>' + (S.stack.length ? '<button class="ib" aria-label="Retour" data-act="back">' + ICON.back + '</button>' : '') +
      '<div class="t"><div class="k">ARCHENERGIE RENOUVELABLE</div><div class="h">' + esc(title) + '</div></div>' +
      (logged && scr !== 'home' ? '<button class="ib" aria-label="Accueil" data-act="home">' + ICON.home + '</button>' : '') + '</header>';
  }
  html += '<main>' + (V[scr] ? V[scr]() : '') + '</main>';
  if (logged && (scr === 'home' || scr === 'profile' || scr === 'admin')) {
    html += '<nav><div class="in"><button class="tab' + (scr === 'home' ? ' on' : '') + '" data-act="home">Accueil</button>' +
      '<button class="tab" data-act="goBottles">Bouteilles</button>' +
      '<button class="avatar' + (scr === 'profile' ? ' on' : '') + '" aria-label="Mon profil" data-act="goProfile">' + esc(initials(S.user)) + '</button></div></nav>';
  }
  var focused = document.activeElement && document.activeElement.getAttribute('data-bind');
  document.getElementById('app').innerHTML = html;
  if (focused) { var el = document.querySelector('[data-bind="' + focused + '"]'); if (el) { el.focus(); try { var n = el.value.length; el.setSelectionRange(n, n); } catch (e) {} } }
}

/* ============================== Événements ============================== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  e.preventDefault();
  var fn = A[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-arg'));
});
document.addEventListener('input', function (e) {
  var el = e.target, p = el.getAttribute && el.getAttribute('data-bind');
  if (!p || el.type === 'checkbox') return;
  setPath(p, el.value);
  if (p === 'search') S.page = 0;
  if (el.getAttribute('data-live')) { var pos = el.selectionStart; render(); var n = document.querySelector('[data-bind="search"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
});
/* ---------- Feuille de relevé : photo -> image allégée -> lecture par Claude -> pré-remplissage ---------- */
function fileToPayload(file) {
  return new Promise(function (resolve, reject) {
    if (file.type === 'application/pdf') {
      if (file.size > 15 * 1024 * 1024) return reject(new Error('PDF trop lourd : envoie seulement la première page (ou une photo).'));
      var fr = new FileReader();
      fr.onload = function () { resolve({ mime: 'application/pdf', data: String(fr.result).split(',')[1] }); };
      fr.onerror = function () { reject(new Error('Impossible de lire le fichier.')); };
      return fr.readAsDataURL(file);
    }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 2000, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Image illisible : reprends la photo.')); };
    img.src = url;
  });
}
function applyReleve(r) {
  var f = S.form, n = 0;
  ['prenom', 'nom', 'adresse', 'cp', 'ville', 'projet', 'type', 'marque', 'modele', 'longueur', 'precharge', 'gpm'].forEach(function (k) {
    if (r[k]) { f[k] = r[k]; n++; }
  });
  if (r.fluide) {
    n++;
    if (MAIN_FLUIDS.indexOf(r.fluide) >= 0) { f.fluideChoix = r.fluide; f.fluideAutre = ''; }
    else { f.fluideChoix = 'Autre'; f.fluideAutre = r.fluide; }
    f.gwpManuel = '';
  }
  f._lu = { n: n, illisible: r.illisible || [] };
  f._sugg = (r.suggestions || []).filter(function (x) { return findMachine(x.modele); });
  f._modeleLu = r.modeleLu || '';
  // Pas de référence exacte : on présélectionne le modèle le plus probable, sans écraser ce qui a été lu
  if (!findMachine(f.modele) && f._sugg.length) applyMachine(f, findMachine(f._sugg[0].modele), true);
}
document.addEventListener('change', function (e) {
  if (e.target.id !== 'releveInput') return;
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  S.reading = true; S.msg = null; render();
  fileToPayload(file)
    .then(function (p) { return call('extractReleve', p); })
    .then(function (r) { S.reading = false; applyReleve(r); render(); window.scrollTo(0, 0); })
    .catch(function (err) { S.reading = false; S.msg = { err: true, text: err.message }; render(); window.scrollTo(0, 0); });
});
document.addEventListener('change', function (e) {
  var el = e.target, p = el.getAttribute && el.getAttribute('data-bind');
  if (!p) return;
  if (el.type === 'checkbox') { setPath(p, el.checked); return; }
  setPath(p, el.value);
  if (p === 'form.type') {
    var ft = S.form, cm = findMachine(ft.modele);
    if (cm && el.value && cm.type && cm.type !== el.value) dropMachine(ft);
    if (el.value && brandMatch(ft.marque) && brandsFor(el.value).indexOf(brandMatch(ft.marque)) < 0) { dropMachine(ft); ft.marque = ''; }
    render(); return;
  }
  if (p === 'form._marqueSel') {
    var f = S.form, b = el.value;
    var cur = findMachine(f.modele); if (!cur || cur.marque !== b) dropMachine(f);
    f._marqueAutre = b === 'Autre'; f.marque = b === 'Autre' ? '' : b; f._modeleAutre = false;
    render(); return;
  }
  if (p === 'form._modeleSel') {
    var f2 = S.form;
    f2._modeleAutre = el.value === 'Autre';
    if (f2._modeleAutre) f2.modele = ''; else { f2.modele = el.value; var mm = findMachine(el.value); if (mm) applyMachine(f2, mm); }
    render(); return;
  }
  if (p === 'form.modele') { var m = findMachine(el.value); if (m) applyMachine(S.form, m); render(); return; }
  if (el.getAttribute('data-rerender') || p === 'form.fluideAutre' || p === 'form.longueur') render();
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (S.screen === 'login') A.doLogin();
  else if (S.screen === 'setup') A.doSetup();
});

/* ============================== Démarrage ============================== */
(function start() {
  S.token = load('are_token');
  call('status').then(function (st) {
    S.status = st;
    if (st.needsSetup) { S.form = { prenom: st.adminPrenom || '', nom: '', email: st.ownerEmail || '', password: '', confirm: '' }; S.screen = 'setup'; return render(); }
    var goLogin = function () { S.form = { email: '', password: '', remember: true }; S.screen = 'login'; S.msg = null; render(); };
    var first = S.token ? rawCall('me').then(function (u) { S.user = u; }) : Promise.reject(new Error('SESSION'));
    first.catch(function () { return resume(); })          // reconnexion automatique (« rester connecté »)
      .then(function () { S.screen = 'home'; loadChantiers(); })
      .catch(goLogin);
  }).catch(function (e) {
    document.getElementById('app').innerHTML = '<main><div class="msg err">Impossible de joindre le serveur : ' + esc(e.message) + '</div></main>';
  });
})();
</script>
