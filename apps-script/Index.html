<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARE Fluides</title>
<style>
  :root{--ink:#1B2448;--muted:#4E5670;--green:#2C3A6F;--green-dark:#1F2A55;--mint:#EEF5D3;--olive:#3F4D0F;--lime:#B9D246;--navy:#2C3A6F;--navy-tint:#E6E9F4;--bg:#F3F4F8;--line:#E5E7EF;--field:#C8CCDA;--warn:#A3330D;--warn-bg:#FFE6DA;--white:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px}
  header .t{flex:1;min-width:0}
  header .lg{display:flex;flex:0 0 auto;height:40px}
  header .lg svg{height:40px;width:auto}
  header .sep{width:1px;align-self:stretch;margin:8px 0;background:rgba(255,255,255,.25);flex:0 0 auto}
  header .h{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--white);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .rows{background:var(--white);border-radius:16px;padding:4px 16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;text-align:right}
  .sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .note{font-size:13px;color:var(--muted);line-height:1.45}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
  input,select,textarea{height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 12px;background:#fff;width:100%}
  textarea{height:auto;padding:10px 12px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .btn{min-height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;width:100%}
  .btn.out{background:#fff;color:var(--ink);border:1.5px solid var(--ink);font-weight:600}
  .btn.dark{background:var(--ink)}
  .btn.lime{background:var(--lime);color:var(--ink)}
  .btn.danger{background:var(--warn-bg);color:var(--warn)}
  .btn.ghost{background:transparent;color:var(--green);font-weight:600}
  .btn[disabled]{background:#DCDFE8;color:var(--muted);cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .years{position:relative;cursor:grab;display:flex;align-items:center;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px calc(50% - 60px);margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
  .years::-webkit-scrollbar{display:none}
  .years.drag{cursor:grabbing;scroll-snap-type:none}
  .years.drag .yr{pointer-events:none}
  .yr{flex:0 0 120px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:0;background:none;color:var(--muted);cursor:pointer;transition:color .2s}
  .yr .y{font-size:19px;font-weight:600;transition:font-size .2s}
  .yr .n{font-size:12px;opacity:0;transition:opacity .2s}
  .yr.on{color:var(--green)}
  .yr.on .y{font-size:32px;font-weight:800;letter-spacing:-.5px}
  .yr.on .n{opacity:1;color:var(--muted)}
  .pw{position:relative;display:block}
  .pw input{padding-right:52px;width:100%}
  .pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sharebox{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--mint);border-radius:12px;padding:12px;user-select:all;-webkit-user-select:all}
  .chip{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--field);background:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--green);color:#fff}
  .item{text-align:left;border:0;border-radius:16px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(20,32,26,.08);width:100%}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--navy-tint);color:var(--navy);white-space:nowrap}
  .badge.ok{background:var(--mint);color:var(--olive)}
  .badge.grey{background:var(--line);color:var(--ink)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .msg{padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.4}
  .msg.err{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1.5px #F6B49A}
  .msg.ok{background:var(--mint);color:var(--olive)}
  .msg.info{background:#E3EEF9;color:#1D4F7A}
  .admincard{text-align:left;border:0;border-radius:16px;background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%}
  .admincard small{display:block;font-size:13px;color:#D6E68F;margin-top:2px}
  .admincard svg{color:var(--lime)}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  nav .in{max-width:528px;margin:0 auto;display:flex;gap:6px;align-items:center}
  nav .tab{flex:1;min-height:54px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px}
  nav .tab svg{width:22px;height:22px}
  nav .tab.on{background:var(--mint);color:var(--navy)}
  nav .tab.on svg{color:var(--navy)}
  .avatar{width:50px;height:50px;border-radius:99px;border:2px solid var(--lime);background:var(--mint);color:var(--green);font-weight:700;cursor:pointer;flex:0 0 auto}
  .avatar.on{background:var(--green);color:#fff;border-color:var(--green)}
  .search{position:relative}
  .search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
  .search input{padding-left:44px}
  .center{align-items:center;text-align:center}
  .logo{width:100%;max-width:340px;border-radius:20px;background:var(--navy);padding:22px 28px;display:flex;align-items:center;justify-content:center}
  .logo svg{width:100%;height:auto}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
  .sheetbg{position:fixed;inset:0;z-index:20;background:rgba(27,36,72,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .sheet .btn{justify-content:flex-start;min-height:56px;font-size:16px}
  body.typing .loginlogo{display:none}
  .steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .steps .st{display:flex;flex-direction:column;gap:5px;min-width:0}
  .steps i{display:block;height:6px;border-radius:99px;background:#D5DCD7}
  .steps .st.on i{background:var(--navy)}
  .steps .st.cur i{background:var(--lime)}
  .steps span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .stepname{font-size:15px;color:var(--muted);margin-top:-4px}
  .stepname b{color:var(--ink)}
  .steps .cur span{color:var(--ink);font-weight:700}
  .item.opt{border:2px solid transparent}
  .item.opt.on{border-color:var(--green);background:var(--mint)}
  .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:99px;border:0;background:rgba(20,32,26,.75);color:#fff;font-size:15px;cursor:pointer}
  .sigwrap{position:relative;border:1.5px dashed var(--field);border-radius:12px;background:#FBFCFB;height:170px}
  .sigwrap canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:12px}
  .sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;font-size:15px}
  .rappel{background:#EAF1F8;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.45;color:#16324F}
  .rappel ul{margin:6px 0 0;padding-left:18px}.rappel li{margin:3px 0}
  .manip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .manip .chip{min-height:40px;padding:0 12px}
</style>
</head>
<body>
<div id="app"><div class="spin" aria-label="Chargement"></div></div>
<script>
/* ============================== État ============================== */
var S = {
  token: null, user: null, screen: 'loading', stack: [], status: null, msg: null, loaded: false,
  chantiers: [], search: '', page: 0, cur: null, form: null, fluides: [], machines: [],
  ops: [], opForm: null, pwd: { oldPassword: '', newPassword: '', confirm: '' }, busy: false, showPw: {}, share: null, mine: /^[12]$/.test(load('are_mine') || '') ? load('are_mine') : ''
};
var TYPES = ['PAC AE', 'PAC AA Monosplit', 'PAC AA Gainable', 'PAC AA Multisplit', 'PAC AA Multisplit gainable', 'Ballon thermodynamique'];
var MAIN_FLUIDS = ['R32', 'R410A', 'R454C'];
var PAGE = 10; // chantiers par page sur l'accueil

function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ============================== Serveur ============================== */
function rawCall(action, data) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        var e = new Error((r && r.error) || 'Erreur inconnue'); e.code = r && r.error; reject(e);
      })
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : 'Connexion impossible')); })
      .api({ action: action, token: S.token, data: data || {} });
  });
}
/** Reconnexion silencieuse avec le jeton « rester connecté » (prolonge les 30 jours). */
function resume() {
  var r = load('are_remember');
  if (!r) return Promise.reject(new Error('SESSION'));
  return rawCall('resume', { remember: r }).then(function (s) { S.token = s.token; S.user = s.user; store('are_token', s.token); return s; })
    .catch(function (e) { if (e.code === 'SESSION') store('are_remember', null); throw e; });
}
function call(action, data) {
  return rawCall(action, data).catch(function (e) {
    if (e.code !== 'SESSION') throw e;
    // session de 6 h expirée : on tente la reconnexion automatique puis on rejoue l'action
    return resume().then(function () { return rawCall(action, data); }).catch(function (e2) {
      if (e2.code === 'SESSION' || e2.message === 'SESSION') { sessionLost(); throw new Error('Session expirée, reconnecte-toi.'); }
      throw e2;
    });
  });
}
function sessionLost() {
  S.token = null; S.user = null; store('are_token', null);
  S.stack = []; S.form = { email: '', password: '', remember: true }; S.screen = 'login'; S.msg = { err: true, text: 'Session expirée, reconnecte-toi.' }; render();
}
function run(promise, okText) {
  S.busy = true; render();
  return promise.then(function (x) { S.busy = false; if (okText) S.msg = { text: okText }; render(); return x; })
    .catch(function (e) { S.busy = false; S.msg = { err: true, text: e.message }; render(); throw e; });
}

/* ============================== Outils ============================== */
function chantierItem(c) {
  return '<button class="item" data-act="openChantier" data-arg="' + esc(c.id) + '"><span class="top"><span class="badge">' + esc(c.type || '—') + '</span>' +
    '<span class="badge ' + (c.misEnService ? 'ok' : 'warn') + '">' + (c.misEnService ? 'MES ' + esc(c.dateMes) : 'À mettre en service') + '</span></span>' +
    '<span style="font-size:18px;font-weight:700">' + esc(c.client || 'Sans nom') + (c.projet ? ' · ' + esc(c.projet) : '') + '</span>' +
    '<span class="note">' + esc([c.cp, c.ville].filter(Boolean).join(' ')) + '</span>' +
    '<span style="font-size:14px">' + esc([c.marque, c.modele].filter(Boolean).join(' ') || 'Unité extérieure à préciser') + (c.fluide ? ' · ' + esc(c.fluide) : '') + '</span></button>';
}
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(u) { return ((u.prenom || '?').charAt(0) + (u.nom || '').charAt(0)).toUpperCase(); }
function isAdmin() { return S.user && S.user.role === 'admin'; }
function go(screen, keepStack) { if (!keepStack) S.stack.push(S.screen); S.screen = screen; S.msg = null; render(); window.scrollTo(0, 0); }
function home() { S.stack = []; S.screen = 'home'; S.msg = null; loadChantiers(); loadSummary(); }
function loadSummary() { if (!S.user) return; call('profileSummary').then(function (x) { S.summary = x; if (S.screen === 'home' || S.screen === 'profile') render(); }).catch(function () {}); }
function listScreen() { return S.listScreen || 'home'; }
function back() { S.screen = S.stack.pop() || 'home'; if (S.screen === 'home') loadSummary(); S.msg = null; render(); window.scrollTo(0, 0); }
function fluidInfo(code) { for (var i = 0; i < S.fluides.length; i++) if (S.fluides[i].code === code) return S.fluides[i]; return null; }
function genPassword() { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', s = ''; for (var i = 0; i < 10; i++) s += c.charAt(Math.floor(Math.random() * c.length)); return s; }

/* ============================== Données ============================== */
function loadChantiers() {
  render();
  Promise.all([call('listChantiers'), S.fluides.length ? Promise.resolve(S.fluides) : call('listFluides'),
    S.machines.length ? Promise.resolve(S.machines) : call('listMachines').catch(function () { return []; })])
    .then(function (r) { S.chantiers = r[0]; S.fluides = r[1]; S.machines = r[2] || []; S.loaded = true; render(); if (!S.summary) loadSummary(); })
    .catch(function (e) { S.msg = { err: true, text: e.message }; render(); });
}
function emptyForm() {
  return { id: '', projet: '', prenom: '', nom: '', adresse: '', cp: '', ville: '', marque: '', modele: '', chargeUsine: '',
    longueur: '', precharge: '', gpm: '', type: '', fluideChoix: '', fluideAutre: '', inflam: '', gwpManuel: '', commentaires: '' };
}
function formFromChantier(c) {
  var f = emptyForm();
  Object.keys(f).forEach(function (k) { if (c[k] !== undefined) f[k] = c[k]; });
  f.fluideChoix = !c.fluide ? '' : (MAIN_FLUIDS.indexOf(c.fluide) >= 0 ? c.fluide : 'Autre');
  f.fluideAutre = f.fluideChoix === 'Autre' ? c.fluide : '';
  var auto = fluidInfo(c.fluide);
  f.gwpManuel = (c.gwp && (!auto || String(auto.gwp) !== String(c.gwp).replace(',', '.'))) ? c.gwp : '';
  return f;
}
function normModele(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function findMachine(modele) {
  var k = normModele(modele);
  if (k.length < 4) return null;
  return S.machines.filter(function (m) { return normModele(m.modele) === k; })[0] || null;
}
/** Modèle reconnu dans la base : remplit marque, fluide, précharge, g/m et type. */
function applyMachine(f, m, seulementVides) {
  var put = function (k, v) { if (v && (!seulementVides || !f[k])) f[k] = v; };
  f.modele = m.modele; f._modeleAutre = false; f._marqueAutre = false;
  if (m.marque) f.marque = m.marque;
  put('precharge', m.precharge); put('gpm', m.gpm); put('type', m.type); put('chargeUsine', m.charge);
  // Machine sans liaisons frigorifiques (monobloc hydraulique ou RAC Solo) : longueur, précharge et charge à 0
  if (m.liaison && !/frigo/i.test(m.liaison)) { f.longueur = '0'; f.precharge = '0'; f.gpm = '0'; }
  if (m.fluide && (!seulementVides || !formFluid(f))) {
    if (MAIN_FLUIDS.indexOf(m.fluide) >= 0) { f.fluideChoix = m.fluide; f.fluideAutre = ''; }
    else { f.fluideChoix = 'Autre'; f.fluideAutre = m.fluide; }
    f.gwpManuel = '';
  }
}
function brands() {
  var out = [];
  S.machines.forEach(function (m) { if (m.marque && out.indexOf(m.marque) < 0) out.push(m.marque); });
  return out.sort();
}
/** Modèle retiré : on efface aussi la précharge et le g/m qu'il avait remplis. */
function dropMachine(f) {
  var m = findMachine(f.modele);
  if (m) {
    var hy = m.liaison && !/frigo/i.test(m.liaison);
    if (f.precharge === (hy ? '0' : m.precharge)) f.precharge = '';
    if (f.gpm === (hy ? '0' : m.gpm)) f.gpm = '';
    if (hy && f.longueur === '0') f.longueur = '';
    if (f.chargeUsine === m.charge) f.chargeUsine = '';
  }
  f.modele = ''; f._modeleAutre = false;
}
function brandsFor(type) {
  var out = [];
  S.machines.forEach(function (m) { if (m.marque && (!type || m.type === type) && out.indexOf(m.marque) < 0) out.push(m.marque); });
  return out.sort();
}
function typeSelect(f) {
  return '<label>Type d’installation<select data-bind="form.type">' + '<option value=""' + (!f.type ? ' selected' : '') + '>Non renseigné</option>' +
    TYPES.map(function (v) { return '<option' + (f.type === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select></label>';
}
function brandMatch(b) { b = String(b || '').trim().toLowerCase(); return b ? brands().filter(function (x) { return x.toLowerCase() === b; })[0] || '' : ''; }
/** Unité extérieure : type d'installation, puis marque, puis modèle (listes filtrées) ; le choix du modèle remplit le reste. */

function isoToFr(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function frToIso(fr) { var m = String(fr || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : ''; }
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function frNum(n, d) { return isFinite(n) ? n.toFixed(d === undefined ? 2 : d).replace('.', ',') : ''; }
function numOrNaN(v) { if (v === '' || v === null || v === undefined) return NaN; var n = Number(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; }
function b64ToBytes(b64) { var bin = atob(b64), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script'); s.src = PDFLIB_URL;
    s.onload = function () { window.PDFLib ? resolve(window.PDFLib) : reject(new Error('Outil PDF indisponible.')); };
    s.onerror = function () { reject(new Error('Outil PDF indisponible : vérifie la connexion internet.')); };
    document.head.appendChild(s);
  });
}
function cerfaTemplateBytes() {
  if (S.cerfaTpl) return Promise.resolve(S.cerfaTpl);
  return call('cerfaTemplate').then(function (b64) { S.cerfaTpl = b64ToBytes(b64); return S.cerfaTpl; });
}
/* CERFA-FILL-START */
/** Remplit le vrai CERFA 15497*04 (formulaire PDF) et pose la signature de l'opérateur. */
function fillCerfaPdf(PDFLib, templateBytes, fields, signaturePng) {
  return PDFLib.PDFDocument.load(templateBytes).then(function (doc) {
    var form = doc.getForm();
    Object.keys(fields.text).forEach(function (k) {
      try { var tf = form.getTextField(k); tf.setText(String(fields.text[k] || '')); } catch (e) { /* champ absent */ }
    });
    (fields.checks || []).forEach(function (k) { try { form.getCheckBox(k).check(); } catch (e) { /* case absente */ } });
    Object.keys(fields.radio || {}).forEach(function (k) {
      try { var rg = form.getRadioGroup(k); var opts = rg.getOptions(); var v = fields.radio[k]; rg.select(opts.indexOf(v) >= 0 ? v : opts[opts.length - 1]); } catch (e) { /* groupe absent */ }
    });
    return doc.embedFont(PDFLib.StandardFonts.Helvetica).then(function (font) {
      form.updateFieldAppearances(font);
      form.flatten();
      if (!signaturePng) return doc;
      return doc.embedPng(signaturePng).then(function (img) {
        var page = doc.getPages()[0], box = { x: 196, y: 44.5, w: 138, h: 19 };   // case « Date et signature » de l'opérateur, à droite de la date
        var k = Math.min(box.w / img.width, box.h / img.height);
        page.drawImage(img, { x: box.x, y: box.y, width: img.width * k, height: img.height * k });
        return doc;
      });
    });
  }).then(function (doc) { return doc.saveAsBase64(); });
}
/* CERFA-FILL-END */

/** Fait le CERFA rempli et signé sur le téléphone, puis l'envoie dans le Drive. */
function makeCerfa(cerfa, fields, sigB64) {
  return Promise.all([loadPdfLib(), cerfaTemplateBytes()]).then(function (r) {
    return fillCerfaPdf(r[0], r[1], fields, sigB64 ? b64ToBytes(sigB64) : null);
  }).then(function (pdf) { return call('saveCerfa', { cerfa: cerfa, pdf: pdf }); });
}

/** Refait les CERFA (même numéro, signature gardée) puis le rapport : après une modification ou un échec. */
function remakeDocs(cerfas) {
  var i = 0, done = [];
  var next = function () {
    if (i >= cerfas.length) return Promise.resolve();
    var no = cerfas[i++];
    S.progress = 'CERFA ' + i + ' / ' + cerfas.length + '…'; render();
    return call('cerfaData', { cerfa: no }).then(function (x) { return makeCerfa(no, x.fields, x.signature); }).then(function (f) { done.push(f); return next(); });
  };
  return next().then(function () { S.progress = 'Rapport d’installation…'; render(); return call('buildReport', { chantierId: S.cur.id }); })
    .then(function () { S.progress = null; return loadMes(); });
}

function loadMes() {
  if (!S.cur) return Promise.resolve();
  var id = S.cur.id;
  return call('mesContext', { chantierId: id }).then(function (ctx) {
    if (!S.cur || S.cur.id !== id) return;
    S.ctx = ctx; S.cur = ctx.chantier;
    var i; for (i = 0; i < S.chantiers.length; i++) if (S.chantiers[i].id === id) S.chantiers[i] = ctx.chantier;
    render();
  });
}

function newMesState(addOnly) {
  var ctx = S.ctx, c = ctx.chantier, mes = ctx.mes;
  var dets = ctx.detecteurs.filter(function (x) { return x.ok; });
  var d = {
    date: todayIso(), serieUE: (mes && mes.serieUE) || c.serieUE || '', serieUI: (mes && mes.serieUI) || c.serieUI || '',
    op: '', chargeUsine: c.chargeUsine || (ctx.machine && ctx.machine.charge) || '', vide: '', tenue: '',
    nature: ['mes'], natureAutre: '', remontee: '', bouteille: '', poidsAvant: '', poidsApres: '', distributeur: ctx.distributeurs.length === 1 ? ctx.distributeurs[0].id : '',
    detecteur: dets.length === 1 ? dets[0].id : '', fuite: 'non', fuites: [{ loc: '', rep: 'realisee' }, { loc: '', rep: 'realisee' }, { loc: '', rep: 'realisee' }], observations: ''
  };
  var photos = {}; ctx.photoSlots.forEach(function (s) { photos[s] = []; });
  return { step: 0, d: d, photos: photos, sig: null, add: !!addOnly, reading: null };
}

function mesSteps() {
  var m = S.mes, s = ['equip', 'op'];
  if (m.d.op !== 'mes') s.push('fluide', 'etanch');   // tant que l'opération n'est pas choisie, on montre toutes les étapes
  s.push('comment', 'photos');
  return s;
}

/** Complément de charge d'après les liaisons du chantier. */
/** Durée minimale du tirage au vide : 30 min + 1 min par mètre de liaison au-delà de 15 m. */
function dureeMinVide() { var L = numOrNaN(S.ctx.chantier.longueur); return 30 + (isFinite(L) && L > 15 ? Math.ceil(L - 15) : 0); }
function complement() {
  var c = S.ctx.chantier, L = numOrNaN(c.longueur), P = numOrNaN(c.precharge), G = numOrNaN(c.gpm);
  return isFinite(L) && isFinite(P) && isFinite(G) ? Math.max(0, L - P) * G / 1000 : NaN;
}
function mesQuantite() {
  var d = S.mes.d, a = numOrNaN(d.poidsAvant), b = numOrNaN(d.poidsApres);
  if (!isFinite(a) || !isFinite(b)) return NaN;
  return d.op === 'ajout' ? a - b : b - a;
}
function bottlesFor(op) {
  var fl = normModele(S.ctx.chantier.fluide);
  return S.ctx.bouteilles.filter(function (b) {
    if (!/d[ée]p[ôo]t/i.test(b.statut)) return false;
    if (op === 'ajout') return /neuve|transfert/i.test(b.type) && (!b.fluide || normModele(b.fluide) === fl);
    return /r[ée]cup|transfert/i.test(b.type) && (!b.fluide || normModele(b.fluide) === fl);
  });
}

function mesCheckStep(key) {
  var m = S.mes, d = m.d, c = S.ctx.chantier;
  if (key === 'equip') {
    if (!d.date) return 'Indique la date de l’intervention.';
    if (d.date > todayIso()) return 'La date ne peut pas être dans le futur.';
    if (!m.add && !String(d.serieUE).trim()) return 'Saisis le n° de série de l’unité extérieure (ou lis-le sur la photo de la plaque).';
  }
  if (key === 'op' && !d.op) return 'Choisis l’opération réalisée.';
  if (key === 'op' && d.op !== 'mes' && !d.nature.length) return 'Coche la nature de l’intervention (case 4 du CERFA).';
  if (key === 'op' && d.nature.indexOf('autre') >= 0 && d.op !== 'mes' && !String(d.natureAutre).trim()) return 'Précise la nature « Autre » de l’intervention.';
  if (key === 'fluide') {
    if (d.op === 'relache') {
      var vide = numOrNaN(d.vide), duree = numOrNaN(d.tenue), dmin = dureeMinVide();
      if (!isFinite(vide)) return 'Indique le vide atteint (microns).';
      if (vide >= 500) return 'Vide insuffisant : l’objectif est moins de 500 microns. Continue le tirage au vide.';
      if (!isFinite(duree)) return 'Indique la durée du tirage au vide.';
      if (duree < dmin) return 'Durée trop courte : ' + dmin + ' min minimum pour ce chantier.';
      if (!d.remontee) return 'Indique le résultat du test de remontée.';
      if (d.remontee !== 'stable') return d.remontee === 'fuite' ? 'Remontée sans arrêt : fuite à rechercher (test à l’azote) avant la mise en service.' : 'Remontée puis stabilisation : continue le tirage au vide puis refais le test.';
      if (!isFinite(numOrNaN(d.chargeUsine))) return 'Indique la charge usine de l’unité extérieure.';
    }
    if (d.op === 'ajout' || d.op === 'recup') {
      if (!d.bouteille) return 'Choisis la bouteille utilisée.';
      if (!isFinite(numOrNaN(d.poidsAvant)) || !isFinite(numOrNaN(d.poidsApres))) return 'Saisis les deux pesées.';
      if (!(mesQuantite() > 0)) return d.op === 'ajout' ? 'La bouteille doit être plus légère après la charge.' : 'La bouteille doit être plus lourde après la récupération.';
    }
  }
  if (key === 'etanch') {
    if (!d.detecteur) return 'Choisis le détecteur de fuite utilisé.';
    if (d.fuite === 'oui' && !d.fuites.some(function (f) { return String(f.loc).trim(); })) return 'Indique où se trouve la fuite.';
  }
  if (key === 'photos') {
    if (!m.add) {
      var miss = S.ctx.photoRequired.filter(function (s) { return !m.photos[s].length; });
      if (miss.length) return 'Photos obligatoires manquantes : ' + miss.join(', ') + '.';
    }
    if (!m.sig) return 'Signe dans le cadre avant de valider.';
  }
  return '';
}

/* ---------- Valeurs calculées, mises à jour pendant la saisie (sans redessiner l'écran) */
function mesTeqTxt() { var cu = numOrNaN(S.mes.d.chargeUsine), gwp = S.ctx.fluide ? S.ctx.fluide.gwp : NaN; return isFinite(cu) && isFinite(gwp) ? frNum(cu * gwp / 1000, 3) + ' t' : '—'; }
function mesQteTxt() { var q = mesQuantite(); return isFinite(q) ? frNum(q) + ' kg' : '—'; }
function mesEcartHtml() {
  var q = mesQuantite(), comp = complement();
  if (S.mes.d.op !== 'ajout' || !isFinite(q) || !isFinite(comp) || !(comp > 0)) return '';
  var ecart = Math.round((q - comp) * 1000);
  return '<div class="msg ' + (Math.abs(ecart) <= Math.max(30, comp * 100) ? 'ok' : 'info') + '">' + (ecart === 0 ? 'Exactement le complément calculé.' : 'Écart de ' + (ecart > 0 ? '+' : '') + ecart + ' g avec le complément calculé (indicatif : la charge réelle dépend du chantier).') + '</div>';
}
function updateLive(p) {
  var set = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; };
  if (p === 'form.longueur') set('longAlert', longueurAlerte(S.form, findMachine(S.form.modele)));
  if (p.indexOf('mes.d.') === 0 && S.mes) { set('mesTeq', esc(mesTeqTxt())); set('mesQte', esc(mesQteTxt())); set('mesEcart', mesEcartHtml()); }
}

      '<div class="chips" style="flex-wrap:nowrap">' + (x.lien ? '<a class="chip" style="display:flex;align-items:center;text-decoration:none;color:var(--ink)" target="_blank" rel="noopener" href="' + esc(x.lien) + '">PDF</a>' : '<span class="badge warn">PDF à refaire</span>') +
      (mes.peutModifier ? (S.confirmManip === x.cerfa ? '<button class="chip" data-act="deleteManip" data-arg="' + esc(x.cerfa) + '" style="border-color:var(--warn);color:var(--warn)">Confirmer</button>' : '<button class="chip" data-act="askDeleteManip" data-arg="' + esc(x.cerfa) + '" aria-label="Supprimer la fiche ' + esc(x.cerfa) + '">✕</button>') : '') + '</div></div>';
  }).join('');
  h += '</div><div class="sec">Rapport d’installation</div><div class="card" style="gap:10px">';

    if (mes.peutModifier) h += '<button class="btn out" data-act="editReport">Modifier le rapport</button>' + (S.confirmRapport
      ? '<div class="msg err">Supprimer le PDF du rapport ? La mise en service et les CERFA sont gardés, tu pourras recréer le rapport.</div><div class="g2"><button class="btn out" data-act="cancelDeleteReport">Annuler</button><button class="btn danger" data-act="deleteReport">Oui, supprimer</button></div>'
      : '<button class="btn danger" data-act="askDeleteReport">Supprimer le rapport</button>');
  } else {
    h += '<div class="note">Pas de rapport pour cette mise en service.</div>';
    if (mes.peutModifier) h += '<button class="btn out" data-act="editReport">Créer le rapport d’installation</button>';
  }
  h += '</div>';
  h += '<button class="btn" data-act="addManip">Ajouter une manipulation</button>';
  if (mes.peutModifier) {
    var missing = mes.manips.filter(function (x) { return !x.lien; }).length;
    if (missing) h += '<button class="btn out" data-act="remakeDocs">Refaire les documents (CERFA et rapport)</button>';
    if (S.editMes) {
      h += '<div class="card"><b>Modifier la mise en service</b>' +
        '<label>Date de l’intervention<input type="date" max="' + todayIso() + '" data-bind="editMes.date" value="' + esc(S.editMes.date) + '"></label>' +
        field('N° de série UE', 'editMes.serieUE') + field('N° de série UI', 'editMes.serieUI') +
        '<div class="note">Les CERFA gardent leur numéro : ils sont refaits avec la nouvelle date et la signature enregistrée.</div>' +
        '<div class="g2"><button class="btn out" data-act="cancelEditMes">Annuler</button><button class="btn" data-act="saveEditMes">Enregistrer</button></div></div>';
    } else h += '<button class="btn out" data-act="editMes">Modifier la date ou les n° de série</button>';
    h += S.confirmMes
      ? '<div class="msg err">Supprimer la mise en service et ses ' + mes.manips.length + ' fiche(s) CERFA ? Les lignes sont retirées du registre (une copie est gardée dans le tableur) et les pesées des bouteilles sont remises.</div><div class="g2"><button class="btn out" data-act="cancelDeleteMes">Annuler</button><button class="btn danger" data-act="deleteMes">Oui, supprimer</button></div>'

      } else h += '<button class="btn out" data-act="editMes">Compléter les n° de série</button>';

V.mes = function () {

  var h = '<div class="steps">' + steps.map(function (s, i) {
    return '<div class="st' + (i <= m.step ? ' on' : '') + (i === m.step ? ' cur' : '') + '"><i></i><span>' + MES_STEP_LABELS[s] + '</span></div>';
  }).join('') + '</div><div class="stepname">Étape ' + (m.step + 1) + ' sur ' + steps.length + ' · <b>' + MES_STEP_LABELS[key] + '</b></div>' + msgBox();

  if (key === 'equip') {

        (m.reading === w ? '<div class="note" style="display:flex;align-items:center;gap:10px"><span class="spin" style="width:20px;height:20px;margin:0"></span>Lecture de la plaque…</div>' :

  }

  if (key === 'op') {
    h += '<div class="sec">Quelle opération as-tu réalisée ?</div>' + Object.keys(ctx.ops).filter(function (k) { return !(m.add && k === 'mes'); }).map(function (k) {
      var desc = { mes: 'La machine démarre, aucun fluide n’est manipulé. Pas de CERFA.', relache: 'Le fluide de l’unité extérieure est relâché dans les liaisons.', ajout: 'Du fluide neuf est ajouté depuis une bouteille.', recup: 'Le fluide est récupéré dans une bouteille de récupération.' }[k];
      return '<button type="button" class="item opt' + (d.op === k ? ' on' : '') + '" data-act="setOp" data-arg="' + k + '"><b style="font-size:16px">' + esc(ctx.ops[k]) + '</b><span class="note">' + desc + '</span></button>';
    }).join('') + '<div class="note">Chaque manipulation de fluide donne son propre CERFA. Tu pourras en ajouter une autre à la fin.</div>';
    if (d.op && d.op !== 'mes') {
      h += '<div class="sec">[4] Nature de l’intervention (CERFA) *</div><div class="card"><div class="chips">' + NATURES.map(function (n) {
        return '<button type="button" class="chip' + (d.nature.indexOf(n[0]) >= 0 ? ' on' : '') + '" data-act="toggleNature" data-arg="' + n[0] + '">' + esc(n[1]) + '</button>';
      }).join('') + '</div>' + (d.nature.indexOf('autre') >= 0 ? field('Autre (préciser)', 'mes.d.natureAutre') : '') + '<div class="note">Plusieurs cases possibles, comme sur le CERFA.</div></div>';
    }
  }

  if (key === 'fluide') {
    var comp = complement(), q = mesQuantite();
    h += '<div class="sec">' + esc(ctx.ops[d.op]) + '</div>';
    if (d.op === 'relache') {
      var gwp = ctx.fluide ? ctx.fluide.gwp : NaN;

/** Recadre la signature sur le trait (fond transparent), pour qu'elle remplisse la case du CERFA. */
function trimSig(dataUrl) {
  return new Promise(function (resolve) {
    var im = new Image();
    im.onload = function () {
      var c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      var g = c.getContext('2d'); g.drawImage(im, 0, 0);
      var px = g.getImageData(0, 0, c.width, c.height).data, x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
      for (var y = 0; y < c.height; y++) for (var x = 0; x < c.width; x++) if (px[(y * c.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return resolve(dataUrl);
      var pad = 6; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
      var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      resolve(o.toDataURL('image/png'));
    };
    im.onerror = function () { resolve(dataUrl); };
    im.src = dataUrl;
  });
}

  if (S.mes.sig) { var im = new Image(); im.onload = function () { g.drawImage(im, 0, 0, w, h); }; im.src = S.mes.sig; }
  var drawing = false, last = null, moved = false;
  var pos = function (ev) { var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  cv.addEventListener('pointerdown', function (ev) { drawing = true; moved = false; last = pos(ev); try { cv.setPointerCapture(ev.pointerId); } catch (x) {} ev.preventDefault(); });
  cv.addEventListener('pointermove', function (ev) {
    if (!drawing) return; var p = pos(ev); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; moved = true; ev.preventDefault();
  });

}

// On fait défiler avec le doigt, l'année arrêtée au centre est sélectionnée
function initYears() {
  var box = document.getElementById('years'); if (!box) return;
  var act = box.getAttribute('data-sel'), scr0 = S.screen;
  var on = box.querySelector('.yr.on');
  if (on) box.scrollLeft = on.offsetLeft + on.offsetWidth / 2 - box.clientWidth / 2;
  var t = null;
  box.addEventListener('scroll', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (!box.isConnected || S.screen !== scr0) return;
      var mid = box.scrollLeft + box.clientWidth / 2, best = null, d = 1e9;
      Array.prototype.forEach.call(box.querySelectorAll('.yr'), function (b) { var x = Math.abs(b.offsetLeft + b.offsetWidth / 2 - mid); if (x < d) { d = x; best = b; } });
      var cur = box.querySelector('.yr.on');
      if (best && best !== cur) A[act](best.getAttribute('data-arg'));
    }, 160);
  }, { passive: true });
  // Ordinateur : molette verticale = défilement horizontal, et glisser avec la souris
  box.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); box.scrollBy({ left: e.deltaY > 0 ? 120 : -120, behavior: 'smooth' }); }
  }, { passive: false });
  box.addEventListener('mousedown', function (e) { if (e.button === 0) YDRAG = { box: box, x: e.clientX, left: box.scrollLeft, moved: false }; });
}
var YDRAG = null;
window.addEventListener('mousemove', function (e) {
    var drag = YDRAG, box = drag && drag.box;
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; box.classList.add('drag'); }
    if (drag.moved) box.scrollLeft = drag.left - dx;
  });
window.addEventListener('mouseup', function () {
    var drag = YDRAG, box = drag && drag.box;
    if (!drag) return;
    var moved = drag.moved; YDRAG = null;
    if (moved) {
      box.classList.remove('drag');
      // Recaler sur l'année la plus proche du centre (le défilement déclenche la sélection)
      var mid = box.scrollLeft + box.clientWidth / 2, best = null, d = 1e9;
      Array.prototype.forEach.call(box.querySelectorAll('.yr'), function (b) { var x = Math.abs(b.offsetLeft + b.offsetWidth / 2 - mid); if (x < d) { d = x; best = b; } });
      if (best) box.scrollTo({ left: best.offsetLeft + best.offsetWidth / 2 - box.clientWidth / 2, behavior: 'smooth' });
    }
});

    run(call('saveDetecteur', { id: f.id, marque: f.marque, reference: f.reference, serie: f.serie, dernierControle: isoToFr(f.dernierControle) }), f.id ? 'Détecteur modifié.' : 'Détecteur ajouté.')
      .then(function (l) { S.dets = l; A.newDet(); window.scrollTo(0, 0); });
  },
  goDistributeurs: function () { S.dists = null; S.distF = { id: '', nom: '', siret: '', adresse: '' }; go('distributeurs'); call('listDistributeurs').then(function (l) { S.dists = l; render(); }).catch(function (e) { S.msg = { err: true, text: e.message }; render(); }); },
  newDist: function () { S.distF = { id: '', nom: '', siret: '', adresse: '' }; render(); },
  editDist: function (id) {
    var d = S.dists.filter(function (x) { return x.id === id; })[0];
    S.distF = { id: d.id, nom: d.nom, siret: d.siret, adresse: d.adresse }; render();

  },
  saveDist: function () {
    var f = S.distF;
    run(call('saveDistributeur', f), f.id ? 'Distributeur modifié.' : 'Distributeur ajouté.').then(function (l) { S.dists = l; A.newDist(); window.scrollTo(0, 0); });
  },
  goDecl: function () { S.declYear = S.declYear || new Date().getFullYear() - 1; S.decl = null; S.declPdf = null; go('declaration'); loadDecl(); },
  declYear: function (y) { S.declYear = +y; S.decl = null; S.declPdf = null; render(); loadDecl(); },
  declFluid: function (f) { S.declFluid = f; render(); },
  declToggle: function (k) { var d = declDone(); d[k] = !d[k]; store('are_decl_' + S.declYear, JSON.stringify(d)); render(); },
  declExport: function () { run(call('exportDeclaration', { annee: S.declYear }), 'Récapitulatif enregistré dans le Drive.').then(function (x) { S.declPdf = x; render(); }); }
});
function loadDecl() { call('declaration', { annee: S.declYear }).then(function (d) { S.decl = d; if (!d.fluides.some(function (f) { return f.code === S.declFluid; })) S.declFluid = d.fluides.length ? d.fluides[0].code : ''; render(); }).catch(function (e) { S.msg = { err: true, text: e.message }; render(); }); }

document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id !== 'attCam' && id !== 'attFile') return;

  }).then(function (r) {

    if (!target || target === S.user.id) { S.user.attestationChargee = true; S.user.attestationDate = r.date; }
    if (S.opForm && target === S.opForm.id) { S.opForm.attestationChargee = true; S.opForm.attestationDate = r.date; }
    S.msg = { text: 'Attestation enregistrée dans le Drive.' }; render();
  }).catch(function (err) { S.attBusy = null; S.msg = { err: true, text: err.message }; render(); });
});
document.addEventListener('input', function (e) {
  var p = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (p === 'bf.vide' || p === 'bf.plein') { setPath(p, e.target.value); var el = document.getElementById('bfInit'); if (el) el.textContent = bfInitial(); }

  if (/^form\.(modele|marque|chargeUsine|precharge|gpm|fluideAutre)$/.test(p || '')) { setPath(p, e.target.value); refreshMachBox(); }
});

function openPicker(kind, arg, how) {

  else if (kind === 'plate') A.readPlate(arg + (how === 'gal' ? '|gal' : ''));

document.addEventListener('click', function (e) {

});
/* ---------- Feuille de relevé : photo -> image allégée -> lecture par Claude -> pré-remplissage ---------- */
function fileToPayload(file, maxSide) {
  return new Promise(function (resolve, reject) {
    if (file.type === 'application/pdf') {
      if (file.size > 15 * 1024 * 1024) return reject(new Error('PDF trop lourd : envoie seulement la première page (ou une photo).'));
      var fr = new FileReader();
      fr.onload = function () { resolve({ mime: 'application/pdf', data: String(fr.result).split(',')[1] }); };
      fr.onerror = function () { reject(new Error('Impossible de lire le fichier.')); };
      return fr.readAsDataURL(file);
    }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = maxSide || 2000, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Image illisible : reprends la photo.')); };
    img.src = url;
  });
}
function applyReleve(r) {
  var f = S.form, n = 0;
  ['prenom', 'nom', 'adresse', 'cp', 'ville', 'projet', 'type', 'marque', 'modele', 'longueur', 'precharge', 'gpm'].forEach(function (k) {
    if (r[k]) { f[k] = r[k]; n++; }
  });
  if (r.fluide) {
    n++;
    if (MAIN_FLUIDS.indexOf(r.fluide) >= 0) { f.fluideChoix = r.fluide; f.fluideAutre = ''; }
    else { f.fluideChoix = 'Autre'; f.fluideAutre = r.fluide; }
    f.gwpManuel = '';
  }
  f._lu = { n: n, illisible: r.illisible || [] };
  f._sugg = (r.suggestions || []).filter(function (x) { return findMachine(x.modele); });
  f._modeleLu = r.modeleLu || '';
  // Pas de référence exacte : on présélectionne le modèle le plus probable, sans écraser ce qui a été lu
  if (!findMachine(f.modele) && f._sugg.length) applyMachine(f, findMachine(f._sugg[0].modele), true);
}
document.addEventListener('change', function (e) {
  if (e.target.id !== 'releveInput') return;
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  S.reading = true; S.msg = null; render();
  fileToPayload(file)
    .then(function (p) { return call('extractReleve', p); })
    .then(function (r) { S.reading = false; applyReleve(r); render(); window.scrollTo(0, 0); })
    .catch(function (err) { S.reading = false; S.msg = { err: true, text: err.message }; render(); window.scrollTo(0, 0); });
});
document.addEventListener('change', function (e) {
  var el = e.target, p = el.getAttribute && el.getAttribute('data-bind');
  if (!p) return;
  if (el.type === 'checkbox') { setPath(p, el.checked); return; }
  setPath(p, el.value);
  if (p === 'form.type') {
    var ft = S.form, cm = findMachine(ft.modele);
    if (cm && el.value && cm.type && cm.type !== el.value) dropMachine(ft);
    if (el.value && brandMatch(ft.marque) && brandsFor(el.value).indexOf(brandMatch(ft.marque)) < 0) { dropMachine(ft); ft.marque = ''; }
    render(); return;
  }
  if (p === 'form._marqueSel') {
    var f = S.form, b = el.value;
    var cur = findMachine(f.modele); if (!cur || cur.marque !== b) dropMachine(f);
    f._marqueAutre = b === 'Autre'; f.marque = b === 'Autre' ? '' : b; f._modeleAutre = false;
    render(); return;
  }
  if (p === 'form._modeleSel') {
    var f2 = S.form;
    f2._modeleAutre = el.value === 'Autre';
    if (f2._modeleAutre) f2.modele = ''; else { f2.modele = el.value; var mm = findMachine(el.value); if (mm) applyMachine(f2, mm); }
    render(); return;
  }
  if (p === 'form.modele') { var m = findMachine(el.value); if (m) { applyMachine(S.form, m); render(); } else refreshMachBox(); return; }   // pas de re-rendu : un clic sur une proposition doit passer
  if (p === 'mes.d.bouteille') { var bb = S.ctx.bouteilles.filter(function (x) { return x.ref === el.value; })[0]; if (bb && bb.pesee && !S.mes.d.poidsAvant) S.mes.d.poidsAvant = bb.pesee; render(); return; }
  if (p.indexOf('mes.d.') === 0) { updateLive(p); return; }
  if (el.getAttribute('data-rerender') || p === 'form.fluideAutre') render();
});
/* Clavier du téléphone ouvert sur l'écran de connexion : on masque le logo et on garde le bouton visible */
document.addEventListener('focusin', function (e) {
  if ((S.screen !== 'login' && S.screen !== 'setup') || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
  document.body.classList.add('typing');
  var show = function () { var b = document.getElementById('loginBtn') || document.querySelector('[data-act="doSetup"]'); if (b) b.scrollIntoView({ block: 'end', behavior: 'smooth' }); };
  setTimeout(show, 350); setTimeout(show, 800);
});
document.addEventListener('focusout', function () {
  setTimeout(function () { var a = document.activeElement; if (!a || a.tagName !== 'INPUT') document.body.classList.remove('typing'); }, 200);
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {
  if (document.body.classList.contains('typing')) { var b = document.getElementById('loginBtn') || document.querySelector('[data-act="doSetup"]'); if (b) b.scrollIntoView({ block: 'end' }); }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (S.screen === 'login') A.doLogin();
  else if (S.screen === 'setup') A.doSetup();
});

/* ============================== Démarrage ============================== */
(function start() {
  S.token = load('are_token');
  call('status').then(function (st) {
    S.status = st;
    if (st.needsSetup) { S.form = { prenom: st.adminPrenom || '', nom: '', email: st.ownerEmail || '', password: '', confirm: '' }; S.screen = 'setup'; return render(); }
    var goLogin = function () { S.form = { email: '', password: '', remember: true }; S.screen = 'login'; S.msg = null; render(); };
    var first = S.token ? rawCall('me').then(function (u) { S.user = u; }) : Promise.reject(new Error('SESSION'));
    first.catch(function () { return resume(); })          // reconnexion automatique (« rester connecté »)
      .then(function () { S.screen = 'home'; loadChantiers(); })
      .catch(goLogin);
  }).catch(function (e) {
    document.getElementById('app').innerHTML = '<main><div class="msg err">Impossible de joindre le serveur : ' + esc(e.message) + '</div></main>';
  });
})();
</script>
